OUTPUT_MODEL_PATH: /home/enrico.saccon/mpdp_new/sbatch/classification_id/models
PLOT_PATH: /home/enrico.saccon/mpdp_new/sbatch/classification_id/plots

# Model 
LAYERS:
  - Linear(in_size, hid_size // 2)
  - ReLU()
  - Dropout(0.2)
