# Configuration file for examples/3PMD/Prediction/Rectangle/NN/Classification/main.py

RANDOM_SEED: 42

BATCH_SIZE: 64
EPOCHS: 150
PATIENCE: 10
WEIGHT_DEC: 1e-5
LEARN_RATE: 1e-5
HIDDEN_SIZE: 4096

DO_TRAINING: true
TRIG_FUNCS: true  
USE_ONLY_CPU: false
EXPORT_TO_ONNX: true

DATASET: /Users/enrico/Projects/mpdp/circl_small.csv

OUTPUT_MODEL_PATH: /Users/enrico/Projects/mpdp/circl_small/circle/models
PLOT_PATH: /Users/enrico/Projects/mpdp/circl_small/circle/plots

# Model 
LAYERS:
  - Linear(in_size, hid_size // 2)
  - ReLU()
  - Dropout(0.2)
  - Linear(hid_size // 2, hid_size)
  - ReLU()
  - Linear(hid_size, hid_size)
  - ReLU()
  - Linear(hid_size, hid_size // 2)
  - ReLU()
  - Dropout(0.2)
  - Linear(hid_size // 2, out_size)
